name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So a maintainer can re-run the suite without pushing an empty commit.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      # Tests run against a real Postgres. The behaviour worth testing lives in unique
      # indexes, transactional guards, and the generated search vector, none of which a
      # mocked store would exercise.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: imogen
          POSTGRES_PASSWORD: imogen
          POSTGRES_DB: imogen
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U imogen -d imogen"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      DATABASE_URL: postgres://imogen:imogen@localhost:5432/imogen
      TEST_DATABASE_URL: postgres://imogen:imogen@localhost:5432/imogen
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # The media pipeline shells out to ffmpeg for HEIC, RAW, and video.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Apply migrations
        run: bun run db:migrate

      - name: Test
        run: bun test

      - name: Build the web bundle
        run: bun run --filter '@imogen/web' build

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
