services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: imogen
      POSTGRES_PASSWORD: imogen
      POSTGRES_DB: imogen
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U imogen -d imogen']
      interval: 3s
      timeout: 3s
      retries: 20
